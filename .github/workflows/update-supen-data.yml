name: Actualización Automática SUPEN

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 06:00 UTC (medianoche en Costa Rica)
    - cron: '0 6 1 * *'
  # Permite ejecutarlo manualmente en cualquier momento desde la pestaña 'Actions' en GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de actualización SUPEN
        run: node update_supen_data.mjs --no-build

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/supen-data.ts
          if git diff --staged --quiet; then
            echo "No se detectaron cambios nuevos en los datos de la SUPEN."
          else
            git commit -m "chore(data): actualización automática mensual SUPEN [skip ci]"
            git push
          fi
